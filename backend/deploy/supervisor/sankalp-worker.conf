# ==============================================================================
# Sankalp API - Supervisor Queue Worker Configuration
# ==============================================================================
# Path: /etc/supervisor/conf.d/sankalp-worker.conf
# Reload: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl restart all
# Status: sudo supervisorctl status
# ==============================================================================

[program:sankalp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sankalp/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sankalp-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
priority=999
