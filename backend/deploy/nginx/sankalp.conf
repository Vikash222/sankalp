# ==============================================================================
# Sankalp API - Production Nginx Configuration
# ==============================================================================
# Path: /etc/nginx/sites-available/sankalp.conf
# Symlink: ln -s /etc/nginx/sites-available/sankalp.conf /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx
# ==============================================================================

# Rate limiting zones:
# 1. API general requests: 60 requests/minute per IP with burst up to 20
# 2. Authentication/Guest signup endpoints: 10 requests/minute per IP to prevent abuse
limit_req_zone $binary_remote_addr zone=sankalp_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sankalp_auth_limit:10m rate=10r/m;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Redirect all HTTP to HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.sankalp.app;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Production TLS 1.3 / HTTP/2)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sankalp.app;

    root /var/www/sankalp/backend/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # SSL Certificates (Let's Encrypt automated paths)
    ssl_certificate /etc/letsencrypt/live/api.sankalp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sankalp.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.sankalp.app/chain.pem;

    # SSL Protocol & Cipher Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # Upload size limit (sufficient for large GPX files and avatars)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression for fast mobile payload delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml application/gpx+xml;

    # Logging
    access_log /var/log/nginx/sankalp_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/sankalp_error.log warn;

    # --------------------------------------------------------------------------
    # Location Handlers
    # --------------------------------------------------------------------------

    # Primary entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate-limited Auth Endpoints
    location ~* ^/api/v1/auth/ {
        limit_req zone=sankalp_auth_limit burst=5 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate-limited General API Endpoints
    location ~* ^/api/ {
        limit_req zone=sankalp_api_limit burst=20 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # PHP-FPM execution via UNIX socket
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # FastCGI performance tuning
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Block access to hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to storage backup and logs
    location ~ /(storage/logs|bootstrap/cache) {
        deny all;
        return 404;
    }

    # Favicon and Robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
